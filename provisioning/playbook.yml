# ─────────────────────────────────────────────
#  OSINT Course — Module 1 & Module 7 Labs
#  VM1: Student machine (GUI + tools)
#  VM2: Lab server
#        - Port  80 : Roundcube webmail  (Module 1)
#        - Port 8080: Flask simulation   (Module 7)
# ─────────────────────────────────────────────

# ─────────────────────────────────────────────
#  Student machine
# ─────────────────────────────────────────────
- name: VM1 Initialization
  hosts:
    - vm1
  become: true

  tasks:
    - name: Install tools
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - git
          - curl
          - wget
          - firefox
          - chromium
          - libimage-exiftool-perl
        state: present
        update_cache: 'yes'

  roles:
    - role: user-access
      user_access_username: user
      user_access_password: Password123
      user_access_sudo: true

# ─────────────────────────────────────────────
#  Lab server
# ─────────────────────────────────────────────
- name: VM2 Initialization
  hosts:
    - vm2
  become: true

  tasks:

    # ════════════════════════════════════════════════════════════════════════
    #  MODULE 1 — Roundcube webmail (port 80)
    # ════════════════════════════════════════════════════════════════════════

    - name: "[M1] Install mail server and webmail packages"
      ansible.builtin.apt:
        name:
          - postfix
          - dovecot-core
          - dovecot-imapd
          - apache2
          - libapache2-mod-php
          - php
          - php-sqlite3
          - php-mbstring
          - php-xml
          - php-intl
          - php-zip
          - php-curl
          - roundcube
          - roundcube-sqlite3
          - curl
        state: present
        update_cache: 'yes'

    # ── vmail user ───────────────────────────────────────────────────────────
    - name: "[M1] Create vmail group"
      ansible.builtin.group:
        name: vmail
        gid: 5000
        state: present

    - name: "[M1] Create vmail user"
      ansible.builtin.user:
        name: vmail
        uid: 5000
        group: vmail
        shell: /sbin/nologin
        create_home: false
        state: present

    # ── Maildir ──────────────────────────────────────────────────────────────
    - name: "[M1] Create maildir structure for journalist@arcturus-news.com"
      ansible.builtin.file:
        path: "/var/mail/vhosts/arcturus-news.com/journalist/{{ item }}"
        state: directory
        owner: vmail
        group: vmail
        mode: '0700'
      loop:
        - new
        - cur
        - tmp

    # ── Dovecot ──────────────────────────────────────────────────────────────
    - name: "[M1] Deploy Dovecot config"
      ansible.builtin.copy:
        dest: /etc/dovecot/dovecot.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          protocols = imap
          log_path = /var/log/dovecot.log
          mail_location = maildir:/var/mail/vhosts/%d/%n
          mail_uid = vmail
          mail_gid = vmail
          first_valid_uid = 5000
          last_valid_uid = 5000
          auth_mechanisms = plain login
          auth_username_format = %u

          passdb {
            driver = passwd-file
            args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/passwd
          }

          userdb {
            driver = passwd-file
            args = username_format=%u /etc/dovecot/passwd
            default_fields = uid=vmail gid=vmail home=/var/mail/vhosts/%d/%n
          }

          service imap-login {
            inet_listener imap {
              address = 127.0.0.1
              port = 143
            }
          }

          service auth {
            unix_listener /var/spool/postfix/private/auth {
              mode = 0660
            }
          }

          ssl = no

    - name: "[M1] Generate Dovecot password hash"
      ansible.builtin.command:
        cmd: doveadm pw -s SHA512-CRYPT -p osint2025
      register: dovecot_hash
      changed_when: false

    - name: "[M1] Write Dovecot passwd file"
      ansible.builtin.copy:
        dest: /etc/dovecot/passwd
        owner: root
        group: dovecot
        mode: '0640'
        content: "journalist@arcturus-news.com:{{ dovecot_hash.stdout }}:5000:5000::/var/mail/vhosts/arcturus-news.com/journalist::\n"

    - name: "[M1] Configure Dovecot passwd-file auth backend"
      ansible.builtin.copy:
        dest: /etc/dovecot/conf.d/auth-passwdfile.conf.ext
        owner: root
        group: root
        mode: '0644'
        content: |
          passdb {
            driver = passwd-file
            args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/passwd
          }

          userdb {
            driver = passwd-file
            args = username_format=%u /etc/dovecot/passwd
          }

    - name: "[M1] Ensure Dovecot uses lab Maildir location"
      ansible.builtin.lineinfile:
        path: /etc/dovecot/conf.d/10-mail.conf
        regexp: '^mail_location\s*='
        line: 'mail_location = maildir:/var/mail/vhosts/%d/%n'

    - name: "[M1] Ensure Dovecot auth includes passwd-file backend"
      ansible.builtin.lineinfile:
        path: /etc/dovecot/conf.d/10-auth.conf
        regexp: '^#!include auth-passwdfile.conf.ext|^!include auth-passwdfile.conf.ext'
        line: '!include auth-passwdfile.conf.ext'

    # ── Postfix ──────────────────────────────────────────────────────────────
    - name: "[M1] Deploy Postfix main.cf"
      ansible.builtin.copy:
        dest: /etc/postfix/main.cf
        owner: root
        group: root
        mode: '0644'
        content: |
          myhostname = mail.arcturus-news.com
          mydomain = arcturus-news.com
          myorigin = $mydomain
          inet_interfaces = loopback-only
          mydestination = $myhostname, localhost.$mydomain, localhost, $mydomain
          home_mailbox = Maildir/
          mailbox_command = /usr/lib/dovecot/deliver
          smtpd_banner = $myhostname ESMTP
          biff = no
          append_dot_mydomain = no
          readme_directory = no

    # ── Roundcube ────────────────────────────────────────────────────────────
    - name: "[M1] Deploy Roundcube config"
      ansible.builtin.copy:
        dest: /etc/roundcube/config.inc.php
        owner: root
        group: www-data
        mode: '0640'
        content: |
          <?php
          $config = [];
          // Roundcube 1.6+ uses imap_host/smtp_host; default_host/smtp_server are kept for compatibility.
          $config['imap_host'] = '127.0.0.1:143';
          $config['default_host'] = '127.0.0.1';
          $config['default_port'] = 143;
          $config['imap_conn_options'] = ['ssl' => ['verify_peer' => false, 'verify_peer_name' => false]];
          $config['username_domain'] = 'arcturus-news.com';
          $config['smtp_host'] = '127.0.0.1:25';
          $config['smtp_server'] = '127.0.0.1';
          $config['smtp_port'] = 25;
          $config['smtp_user'] = '';
          $config['smtp_pass'] = '';
          $config['product_name'] = 'Arcturus News — Secure Mail';
          $config['support_url'] = '';
          $config['skin'] = 'elastic';
          $config['enable_installer'] = false;
          $config['des_key'] = 'osint_lab_secret_key_24c';
          $config['db_dsnw'] = 'sqlite:////var/roundcube/db/roundcube.db';
          $config['show_headers'] = [];
          $config['dont_override'] = ['show_headers'];

    - name: "[M1] Create Roundcube SQLite db directory"
      ansible.builtin.file:
        path: /var/roundcube/db
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: "[M1] Initialise Roundcube database"
      ansible.builtin.command:
        cmd: php /var/lib/roundcube/bin/initdb.sh --dir=/var/lib/roundcube/SQL
      ignore_errors: true

    - name: "[M1] Remove header toggle links from Roundcube message template"
      ansible.builtin.lineinfile:
        path: /usr/share/roundcube/skins/elastic/templates/message.html
        regexp: "{{ item }}"
        state: absent
      loop:
        - '<a href="#headers" class="headers-summary"'
        - '<a href="#all-headers" class="headers-all"'

    # ── Apache ───────────────────────────────────────────────────────────────
    - name: "[M1] Deploy Apache virtualhost for Roundcube"
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/roundcube.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <VirtualHost *:80>
              ServerName mail.arcturus-news.com
              DocumentRoot /var/lib/roundcube/public_html
              <Directory /var/lib/roundcube/public_html>
                  Options -Indexes
                  AllowOverride All
                  Require all granted
              </Directory>
              ErrorLog ${APACHE_LOG_DIR}/roundcube_error.log
              CustomLog ${APACHE_LOG_DIR}/roundcube_access.log combined
          </VirtualHost>

    - name: "[M1] Disable default Apache site"
      ansible.builtin.command: a2dissite 000-default
      ignore_errors: true

    - name: "[M1] Enable Roundcube site"
      ansible.builtin.command: a2ensite roundcube

    - name: "[M1] Enable Apache rewrite module"
      community.general.apache2_module:
        name: rewrite
        state: present

    - name: "[M1] Enable Apache PHP 8.3 module"
      community.general.apache2_module:
        name: php8.3
        identifier: php_module
        state: present

    - name: "[M1] Check enabled Apache sites"
      ansible.builtin.command: a2query -s
      register: apache_enabled_sites
      changed_when: false

    - name: "[M1] Show Apache virtualhost mapping"
      ansible.builtin.command: apache2ctl -S
      register: apache_vhost_mapping
      changed_when: false

    - name: "[M1] Print Apache enabled sites"
      ansible.builtin.debug:
        var: apache_enabled_sites.stdout_lines

    - name: "[M1] Print Apache virtualhost mapping"
      ansible.builtin.debug:
        var: apache_vhost_mapping.stderr_lines

    # ── Seed email ───────────────────────────────────────────────────────────
    - name: "[M1] Copy whistleblower EML to server"
      ansible.builtin.copy:
        src: ../lab-module1/mail/whistleblower.eml
        dest: /tmp/whistleblower.eml
        owner: root
        group: root
        mode: '0644'

    - name: "[M1] Inject EML into journalist inbox"
      ansible.builtin.shell: |
        TIMESTAMP=$(date +%s)
        FILENAME="${TIMESTAMP}.pid$$.lab"
        cp /tmp/whistleblower.eml /var/mail/vhosts/arcturus-news.com/journalist/new/${FILENAME}
        chown vmail:vmail /var/mail/vhosts/arcturus-news.com/journalist/new/${FILENAME}
        chmod 600 /var/mail/vhosts/arcturus-news.com/journalist/new/${FILENAME}
      changed_when: true

    # ── Services ─────────────────────────────────────────────────────────────
    - name: "[M1] Enable and restart Dovecot"
      ansible.builtin.service:
        name: dovecot
        state: restarted
        enabled: true

    - name: "[M1] Verify Dovecot login for the lab mailbox"
      ansible.builtin.command: doveadm auth test journalist@arcturus-news.com osint2025
      register: dovecot_auth_test
      changed_when: false

    - name: "[M1] Print Dovecot auth test result"
      ansible.builtin.debug:
        var: dovecot_auth_test.stdout_lines

    - name: "[M1] Enable and restart Postfix"
      ansible.builtin.service:
        name: postfix
        state: restarted
        enabled: true

    - name: "[M1] Enable and start Apache2"
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

    - name: "[M1] Reload Apache2 after site/module changes"
      ansible.builtin.service:
        name: apache2
        state: reloaded
        enabled: true

    # ════════════════════════════════════════════════════════════════════════
    #  MODULE 7 — Flask simulation server (port 8080)
    # ════════════════════════════════════════════════════════════════════════

    - name: "[M7] Install Python and system dependencies"
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present

    # ── App directory ────────────────────────────────────────────────────────
    - name: "[M7] Create app directory"
      ansible.builtin.file:
        path: /opt/lab-module7
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: "[M7] Create templates directory"
      ansible.builtin.file:
        path: /opt/lab-module7/templates
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: "[M7] Create static image directory"
      ansible.builtin.file:
        path: /opt/lab-module7/static/img
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    # ── Python venv and Flask ────────────────────────────────────────────────
    - name: "[M7] Create Python virtual environment"
      ansible.builtin.command:
        cmd: python3 -m venv /opt/lab-module7/venv
        creates: /opt/lab-module7/venv

    - name: "[M7] Install Flask in virtual environment"
      ansible.builtin.pip:
        name: flask
        virtualenv: /opt/lab-module7/venv

    # ── Deploy app files ─────────────────────────────────────────────────────
    - name: "[M7] Deploy Flask app"
      ansible.builtin.copy:
        src: ../lab-module7/app.py
        dest: /opt/lab-module7/app.py
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: "[M7] Deploy HTML templates"
      ansible.builtin.copy:
        src: "../lab-module7/templates/{{ item }}"
        dest: "/opt/lab-module7/templates/{{ item }}"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      loop:
        - index.html
        - github_alex.html
        - github_nina.html
        - github_notifications.html
        - github_sara_repo.html
        - github_sara_watchers.html
        - linkedout_alex.html
        - linkedout_emma.html
        - linkedout_james.html
        - linkedout_nina.html
        - linkedout_sara.html
        - linkedout_sara_views.html
        - personal_website.html
        - personal_website_analytics.html

    - name: "[M7] Deploy profile images"
      ansible.builtin.copy:
        src: "../lab-module7/static/img/{{ item }}"
        dest: "/opt/lab-module7/static/img/{{ item }}"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      loop:
        - alex.jpg
        - emma.jpg
        - james.jpg
        - nina.jpg
        - sara.jpg

    # ── Systemd service ──────────────────────────────────────────────────────
    - name: "[M7] Deploy systemd service for Flask app"
      ansible.builtin.copy:
        dest: /etc/systemd/system/lab-module7.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=OSINT Lab Module 7 — Flask simulation server
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/opt/lab-module7
          ExecStart=/opt/lab-module7/venv/bin/python app.py
          Restart=always
          RestartSec=3
          Environment=FLASK_ENV=production

          [Install]
          WantedBy=multi-user.target

    - name: "[M7] Reload systemd daemon"
      ansible.builtin.systemd:
        daemon_reload: true

    - name: "[M7] Enable and start Flask service"
      ansible.builtin.service:
        name: lab-module7
        state: started
        enabled: true

  roles:
    - role: user-access
      user_access_username: user
      user_access_password: Password123
      user_access_sudo: true