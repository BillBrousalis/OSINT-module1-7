<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nina Scholz | LinkedOut</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #f3f2ef; color: rgba(0,0,0,0.9); font-size: 14px; }
        a { color: #0a66c2; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .navbar { background: #fff; border-bottom: 1px solid rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 100; padding: 0 24px; display: flex; align-items: center; gap: 8px; height: 52px; }
        .navbar-logo { font-size: 1rem; color: #0a66c2; font-weight: 900; letter-spacing: -0.5px; margin-right: 8px; }
        .navbar-search { background: #eef3f8; border: none; border-radius: 4px; padding: 8px 12px; font-size: 0.85rem; width: 220px; color: #333; }
        .navbar-links { margin-left: auto; display: flex; align-items: center; gap: 4px; }
        .navbar-link { display: flex; flex-direction: column; align-items: center; padding: 0 12px; color: rgba(0,0,0,0.6); font-size: 0.7rem; cursor: pointer; height: 52px; justify-content: center; gap: 2px; }
        .navbar-link span:first-child { font-size: 1.1rem; }
        .page { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
        .card { background: #fff; border-radius: 8px; border: 1px solid rgba(0,0,0,0.08); margin-bottom: 8px; overflow: hidden; }
        .card-body { padding: 16px; }
        .profile-banner { height: 120px; background: linear-gradient(135deg, #b74b00 0%, #e05c00 100%); }
        .profile-info { padding: 8px 16px 16px; }
        .profile-name { font-size: 1.3rem; font-weight: 600; margin-bottom: 2px; }
        .profile-headline { color: rgba(0,0,0,0.7); margin-bottom: 4px; font-size: 0.9rem; }
        .profile-meta { color: rgba(0,0,0,0.6); font-size: 0.8rem; margin-bottom: 8px; }
        .profile-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .btn-primary { padding: 6px 16px; border-radius: 16px; font-size: 0.85rem; font-weight: 600; background: #0a66c2; color: #fff; border: none; cursor: pointer; }
        .btn-secondary { padding: 6px 16px; border-radius: 16px; font-size: 0.85rem; font-weight: 600; background: #fff; color: #0a66c2; border: 1px solid #0a66c2; cursor: pointer; }
        .exp-item { display: flex; gap: 12px; margin-bottom: 16px; }
        .exp-logo { width: 44px; height: 44px; background: #eef3f8; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .exp-role { font-weight: 600; font-size: 0.9rem; }
        .exp-company { color: rgba(0,0,0,0.7); font-size: 0.85rem; }
        .exp-dates { color: rgba(0,0,0,0.5); font-size: 0.8rem; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-logo">LinkedOut</div>
    <input class="navbar-search" type="text" placeholder="Search"/>
    <div class="navbar-links">
        <div class="navbar-link"><span>🏠</span><span>Home</span></div>
        <div class="navbar-link"><span>👥</span><span>My Network</span></div>
        <div class="navbar-link"><span>💼</span><span>Jobs</span></div>
        <div class="navbar-link"><span>💬</span><span>Messaging</span></div>
        <div class="navbar-link"><span>🔔</span><span>Notifications</span></div>
        <div class="navbar-link"><span>👤</span><span>Me</span></div>
    </div>
</nav>
<div class="page">
    <div class="card">
        <div class="profile-banner"></div>
        <div style="margin-top:-48px; margin-left:16px; margin-bottom:0;">
            <img src="/static/img/nina.jpg" style="width:96px; height:96px; border-radius:50%; object-fit:cover; border:3px solid #fff; display:block;"/>
        </div>
        <div class="profile-info">
            <div class="profile-name">Nina Scholz</div>
            <div class="profile-headline">SOC Analyst at DataShield</div>
            <div class="profile-meta">Berlin, Germany &nbsp;·&nbsp; <a href="#">184 connections</a></div>
            <div class="profile-meta"><span style="font-weight:600;">DataShield</span> &nbsp;·&nbsp; Humboldt University Berlin</div>
            <div class="profile-actions">
                <button class="btn-primary">Connect</button>
                <button class="btn-secondary">Message</button>
                <button class="btn-secondary">More</button>
            </div>
        </div>
    </div>
    <div class="card">
        <div class="card-body">
            <p style="font-size:1rem; font-weight:600; margin-bottom:12px;">Experience</p>
            <div class="exp-item">
                <div class="exp-logo">🛡️</div>
                <div>
                    <div class="exp-role">SOC Analyst</div>
                    <div class="exp-company">DataShield · Full-time</div>
                    <div class="exp-dates">Sep 2022 – Present · Berlin, Germany</div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
